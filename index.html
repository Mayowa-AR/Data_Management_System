/* ================= ORIGINATION CREDITS (managing partner only) ================= */
function renderOrigination(app){
  if(!canOriginate()){ location.hash=cfg().home; return }
  const all=registerDeals().sort((a,b)=>(needsCredit(b)-needsCredit(a))||(b.approvedAt||'').localeCompare(a.approvedAt||''));
  const pending=all.filter(needsCredit);
  const byPerson={};
  all.forEach(d=>creditSplit(d).forEach(l=>{const p=(byPerson[l.name]??={deals:0,credit:0});p.deals++;p.credit+=calc(d).bill*n(l.pct)/100}));
  const people=Object.entries(byPerson).map(([k,v])=>({k,...v})).sort((a,b)=>b.credit-a.credit);
  const lineHTML=(l={})=>`<div class="flex items-center gap-2 mb-2" data-line>
      <select class="input" style="min-width:0;flex:1" data-person aria-label="Person credited"><option value="">Choose a person</option>${feeEarners().map(u=>`<option value="${esc(u.name)}" ${u.name===l.name?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
      <input class="input num" style="width:72px;flex:none" type="number" min="0" max="100" step="1" inputmode="decimal" data-pct value="${esc(l.pct??'')}" aria-label="Percentage"><span class="hint">%</span>
      <button type="button" class="btn btn-quiet" style="padding:6px 8px" data-remove-line aria-label="Remove this person">✕</button></div>`;
  app.innerHTML=`<div class="fade-in">
    <div class="mb-6"><p class="eyebrow mb-2">Managing partner only</p><h1 class="text-[34px] md:text-[44px]">Origination credits</h1>
      <p class="hint mt-2 max-w-[72ch]" style="font-size:15px">Every deal sheet approved by a reviewing partner appears here. Credit one or more people with a share of the deal's fees; shares can't add up to more than 100%. Only you can see or change these figures.</p></div>
    <div class="card-raised grid grid-cols-2 md:grid-cols-3 mb-8 overflow-hidden">
      <div class="stat"><div class="eyebrow">Waiting for a credit</div><div class="v ${pending.length?'warn':''}">${pending.length}</div><div class="s">approved deals</div></div>
      <div class="stat"><div class="eyebrow">Complete</div><div class="v">${all.length-pending.length}</div><div class="s">of ${all.length} deals</div></div>
      <div class="stat"><div class="eyebrow">Credited fees</div><div class="v">${money(sum(people,p=>p.credit))}</div><div class="s">across ${people.length} ${people.length===1?'person':'people'}</div></div>
    </div>
    <div class="card-raised overflow-hidden mb-10"><div class="overflow-x-auto"><table class="data" id="creditTable">
      <thead><tr><th>Deal and client</th><th>Completed</th><th>Originated by</th><th class="r">Fees billed</th><th style="min-width:330px">Credit split</th><th class="r">Credited fees</th><th></th></tr></thead>
      <tbody>${all.map(d=>{const lines=creditSplit(d).length?creditSplit(d):[{name:d.originator}];return `<tr data-id="${d.id}">
        <td style="min-width:220px"><a href="#deal/${d.id}" class="font-semibold" style="color:inherit;line-height:1.4">${esc(d.name)}</a><div class="hint">${esc(d.client?.name)}${d.matter?' · <span class="mono">'+esc(d.matter)+'</span>':''}</div><div class="hint">Lead partner: ${esc(d.leadPartner)}</div></td>
        <td class="num whitespace-nowrap">${dfmt(d.completed)}</td>
        <td class="whitespace-nowrap">${esc(d.originator||'–')}</td>
        <td class="r num">${money(calc(d).bill)}</td>
        <td><div data-lines>${lines.map(lineHTML).join('')}</div>
          <div class="flex items-center justify-between gap-2"><button type="button" class="btn btn-quiet" style="padding-left:0" data-add-line>+ Add person</button><span class="hint num" data-total></span></div></td>
        <td class="r num whitespace-nowrap" data-credit></td>
        <td class="r whitespace-nowrap">${needsCredit(d)?'<span class="pill pill-warn">Needs credit</span>':'<span class="pill pill-gain">Complete</span>'}</td>
      </tr>`}).join('')}</tbody></table></div>
      <div class="flex flex-wrap items-center gap-3 p-4 border-t" style="border-color:var(--line-2);background:var(--surface)"><p class="err" id="origErr" role="alert"></p><button class="btn btn-primary ml-auto" id="saveCredits">Save credits</button></div>
    </div>
    ${people.length?`<h2 class="text-[26px] mb-1">Origination by person</h2><p class="hint mb-4">Credited fees across all deals with a credit entered.</p>
    <div class="card-raised overflow-x-auto"><table class="data"><thead><tr><th>Person</th><th class="r">Deals credited</th><th class="r">Credited fees</th></tr></thead>
      <tbody>${people.map(p=>`<tr><td class="font-semibold">${esc(p.k)}</td><td class="r num">${p.deals}</td><td class="r num">${money(p.credit)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </div>`;
  // A line only counts once it has a percentage; the originator is pre-selected on untouched rows.
  const readLines=tr=>$$('[data-line]',tr).map(el=>({el,name:$('[data-person]',el).value,pct:$('[data-pct]',el).value.trim()}));
  const updateRow=tr=>{
    const d=deals.find(x=>x.id===tr.dataset.id), lines=readLines(tr).filter(l=>l.pct!=='');
    const total=sum(lines,l=>n(l.pct));
    const t=$('[data-total]',tr); t.textContent=lines.length?`Total ${hrs(total)}%`:''; t.style.color=total>100?'var(--tape-deep)':'';
    $('[data-credit]',tr).innerHTML=lines.filter(l=>l.pct!=='').map(l=>money(calc(d).bill*n(l.pct)/100)).join('<br>')||'–';
  };
  const table=$('#creditTable');
  $$('tbody tr',table).forEach(updateRow);
  table.addEventListener('input',e=>{const tr=e.target.closest('tr[data-id]'); if(tr) updateRow(tr)});
  table.addEventListener('change',e=>{const tr=e.target.closest('tr[data-id]'); if(tr) updateRow(tr)});
  table.addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-id]'); if(!tr) return;
    if(e.target.closest('[data-add-line]')){ $('[data-lines]',tr).insertAdjacentHTML('beforeend',lineHTML()); $('[data-line]:last-child [data-person]',tr).focus(); updateRow(tr) }
    const rm=e.target.closest('[data-remove-line]');
    if(rm){ const box=$('[data-lines]',tr); if(box.children.length>1) rm.closest('[data-line]').remove(); else { $('[data-person]',box).value=''; $('[data-pct]',box).value='' } updateRow(tr) }
  });
  $('#saveCredits').onclick=()=>{
    $$('[aria-invalid]',table).forEach(i=>i.removeAttribute('aria-invalid'));
    const problems=[], updates=[];
    $$('tbody tr[data-id]',table).forEach(tr=>{
      const d=deals.find(x=>x.id===tr.dataset.id), lines=readLines(tr).filter(l=>l.pct!=='');
      let bad=false; const seen=new Set();
      lines.forEach(l=>{
        if(!l.name){$('[data-person]',l.el).setAttribute('aria-invalid','true');bad=true}
        if(!(n(l.pct)>=0&&n(l.pct)<=100)){$('[data-pct]',l.el).setAttribute('aria-invalid','true');bad=true}
        if(l.name&&seen.has(l.name)){$('[data-person]',l.el).setAttribute('aria-invalid','true');bad=true} seen.add(l.name);
      });
      if(sum(lines,l=>n(l.pct))>100){lines.forEach(l=>$('[data-pct]',l.el).setAttribute('aria-invalid','true'));bad=true}
      if(bad){problems.push(d.name);return}
      const split=lines.map(l=>({name:l.name,pct:String(n(l.pct))}));
      if(JSON.stringify(split)!==JSON.stringify(creditSplit(d))) updates.push([d,split]);
    });
    if(problems.length){$('#origErr').textContent=`Check ${list(problems.slice(0,2))}${problems.length>2?` and ${problems.length-2} more`:''}: each share needs a person and must be 0–100%, no one twice, and no more than 100% in total.`;table.querySelector('[aria-invalid]').focus();return}
    const now=new Date().toISOString(), user=me();
    updates.forEach(([d,split])=>{ if(split.length) d.originationSplit=split; else delete d.originationSplit; delete d.originationPct; d.originationSetBy=user.id; d.originationAt=now; });
    if(updates.length) audit('origination',`Updated origination credits on ${updates.length} deal${updates.length>1?'s':''}: ${updates.map(([d])=>d.name).join('; ')}`);
    save(); toast(updates.length?`Saved origination credits for ${updates.length} deal${updates.length>1?'s':''}`:'No changes to save'); renderTopbar(user,'origination'); renderOrigination(app);
  };
}

  $$('[data-tab]').forEach(b=>b.onclick=()=>{store.set(LKEY,b.dataset.tab);show(b.dataset.tab)});

function dealPhrase(name){
  // "Acquisition of X" -> "the acquisition of X"; keep acronyms, figures and proper nouns as written
  const first=name.split(' ')[0];
  const lower=/^[A-Z][a-z-]+$/.test(first)&&first!=='Series'?name.charAt(0).toLowerCase()+name.slice(1):name;
  return 'the '+lower;
}
// The directory write-up for a deal, as plain paragraphs (used on the BD tab and in the submission pack)
function blurbParas(d){
  const team=d.team||[];

  const v=n(d.value)?new Intl.NumberFormat('en-GB',{style:'currency',currency:d.valueCcy||'USD',notation:'compact',maximumFractionDigits:1}).format(n(d.value)):'';
  return [
    `Advised ${d.referable==='public'?d.client?.name:'a '+(d.client?.sector||'').toLowerCase()+' client'}${d.actingFor?' ('+d.actingFor+')':''} on ${d.referable==='public'?dealPhrase(d.name):'a '+(d.type||'').toLowerCase()}${v?', valued at '+v:''}, completed ${mfmt(d.completed)}.`,
    d.description, d.significance, d.notable,
    `The team was led by ${list(partners.length?partners:[d.leadPartner])}${others.length?`, with ${list(others)}`:''}.${(d.localCounsel||[]).length?` Local counsel: ${list(d.localCounsel.map(l=>`${l.firm} (${l.jurisdiction})`))}.`:''}${d.opposingCounsel?` Other parties were advised by ${d.opposingCounsel}.`:''}`
  ].filter(Boolean);
}
